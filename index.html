<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End of day brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBE7;
  --surface:#FFFFFF;
  --ink:#16201C;
  --ink-2:#5A6862;
  --ink-3:#8A958F;
  --rule:#D3D9D3;
  --rule-strong:#B9C2BB;
  --marigold:#B57E00;
  --clay:#A33A2B;
  --teal:#0E5A50;
  --harbor:#2A5F82;
  --slate:#67746E;
  --focus:#2A5F82;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;
}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}

/* ---------- masthead ---------- */
.masthead{padding-bottom:18px}
.logo{display:block;width:clamp(190px,26vw,270px);height:auto;margin:0 0 22px}
.masthead h1{margin:0;font-size:clamp(30px,5.2vw,50px);font-weight:700;font-stretch:114%;
  letter-spacing:-0.018em;line-height:1.04}
.masthead .date{display:block;color:var(--ink-2);font-weight:700;font-stretch:100%;
  font-size:clamp(15px,2.4vw,19px);letter-spacing:-0.004em;margin-top:7px}
.shiftline{margin:14px 0 0;color:var(--ink-2);font-size:14.5px;max-width:64ch}
.shiftline b{font-weight:600;color:var(--ink)}

/* ---------- brand tabs ---------- */
.brandbar{display:flex;flex-wrap:wrap;gap:26px;border-bottom:2px solid var(--ink)}
.brandtab{font:inherit;font-size:clamp(15px,2vw,18px);font-weight:600;font-stretch:106%;
  background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-3);
  padding:0 0 9px;margin-bottom:-2px;cursor:pointer;letter-spacing:-0.005em}
.brandtab:hover{color:var(--ink-2)}
.brandtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.brandtab .n{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:6px;vertical-align:2px}
.brandtab[aria-selected="true"] .n{color:var(--marigold)}

/* ---------- chart panel ---------- */
.panel{background:var(--surface);padding:24px 26px 22px;margin:26px 0 30px}
.panel h2{margin:0 0 3px;font-size:20px;font-weight:700;font-stretch:110%;letter-spacing:-0.012em}
.panel .lede{margin:0;color:var(--ink-2);font-size:14.5px;max-width:66ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 30px;margin:20px 0 6px}
.leg{display:flex;align-items:baseline;gap:9px}
.leg .sw{width:11px;height:11px;flex:none;transform:translateY(1px)}
.leg .v{font-size:26px;font-weight:700;font-stretch:108%;letter-spacing:-0.02em;line-height:1}
.leg .t{font-size:13.5px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.flagline{margin:16px 0 0;font-size:14px;color:var(--clay);font-weight:600}
.flagline[hidden]{display:none}

/* ---------- approvals panel ---------- */
.attention{background:var(--surface);border-left:4px solid var(--marigold);padding:22px 24px 8px;margin:0 0 30px}
.attention[hidden]{display:none}
.attention h2{margin:0 0 4px;font-size:20px;font-weight:700;font-stretch:110%;letter-spacing:-0.012em}
.attention .lede{margin:0 0 16px;color:var(--ink-2);font-size:14.5px;max-width:64ch}
.ask{display:grid;grid-template-columns:14px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--rule)}
.ask[hidden]{display:none}
.ask .dot{width:10px;height:10px;margin-top:7px;background:var(--marigold)}
.ask h3{margin:0;font-size:16px;font-weight:600;font-stretch:104%;line-height:1.35}
.ask p{margin:3px 0 0;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.ask a{color:var(--ink)}

/* ---------- filter bar ---------- */
.filterbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;
  background:var(--surface);padding:14px 16px;margin-bottom:16px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl > span{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:0.04em}
.fl select,.fl input{font:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--rule-strong);border-radius:2px;padding:6px 9px;min-width:150px}
.fl input{min-width:210px}
.fl select:focus-visible,.fl input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fl.hidden{display:none}
.filterbar .plain{margin-left:auto;align-self:flex-end;margin-bottom:7px}
.filterbar .plain[hidden]{display:none}
.emptystate{padding:26px 0;color:var(--ink-3);font-size:15px;border-top:1px solid var(--rule)}

/* ---------- sub-tabs ---------- */
.subbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.subtab{font:inherit;font-size:14px;font-weight:500;background:transparent;color:var(--ink-2);
  border:1px solid var(--rule-strong);border-radius:2px;padding:5px 12px;cursor:pointer}
.subtab:hover{border-color:var(--ink-2);color:var(--ink)}
.subtab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.subtab .n{opacity:.62;margin-left:5px;font-size:12.5px}
.toolrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
  border-top:1px solid var(--rule);padding-top:9px;margin-bottom:26px}
.tally{font-size:13.5px;color:var(--ink-3);margin:0}
.plain{font:inherit;font-size:13.5px;background:none;border:0;border-bottom:1px solid var(--rule-strong);
  color:var(--ink-2);cursor:pointer;padding:2px 0;margin-left:auto}
.plain:hover{color:var(--ink);border-color:var(--ink)}
.brandtab:focus-visible,.subtab:focus-visible,.plain:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- tables ---------- */
.block{margin-bottom:36px}
.block[hidden]{display:none}
.block > h2{margin:0 0 3px;font-size:19px;font-weight:700;font-stretch:110%;letter-spacing:-0.01em;
  border-bottom:1.5px solid var(--ink);padding-bottom:7px;display:flex;align-items:baseline;gap:11px}
.block > h2 .count{font-size:13.5px;color:var(--ink-3);font-weight:500}
.block .note{margin:11px 0 0;font-size:14px;color:var(--ink-2);max-width:70ch}
table{width:100%;border-collapse:collapse;margin-top:4px}
th{text-align:left;font-size:12px;font-weight:700;font-stretch:106%;
  text-transform:uppercase;letter-spacing:0.07em;
  color:#fff;background:var(--ink);padding:10px 14px;border-bottom:0;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
td{padding:13px 14px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:15.5px}
th:first-child,td:first-child{padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
.c-status{width:126px}
.c-ref{width:190px}
.c-area{width:150px}
.c-brand{width:150px}
.status{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600}
.status .mark{width:9px;height:9px;flex:none;margin-top:5px}
.s-done{color:var(--teal)}          .s-done .mark{background:var(--teal)}
.s-moving{color:var(--harbor)}      .s-moving .mark{background:var(--harbor)}
.s-waiting{color:var(--marigold)}   .s-waiting .mark{background:var(--marigold)}
.s-issue{color:var(--clay)}         .s-issue .mark{background:var(--clay)}
.s-hold{color:var(--slate)}         .s-hold .mark{background:transparent;border:2px solid var(--slate)}
td .task{font-weight:560;line-height:1.4}
td .detail{margin:3px 0 0;color:var(--ink-2);font-size:14.5px;max-width:70ch}
td.c-ref,td.c-area,td.c-brand{font-size:13.5px;color:var(--ink-2)}
td.c-ref div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--rule-strong)}
td a:hover{text-decoration-color:var(--ink)}

/* ---------- key + footer ---------- */
.key{display:flex;flex-wrap:wrap;gap:18px;padding:18px 0 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.key .k{display:flex;align-items:center;gap:7px}
.key .mark{width:9px;height:9px;flex:none}
.key .s-hold .mark{background:transparent;border:2px solid var(--slate)}
footer{margin-top:26px;font-size:13px;color:var(--ink-3);max-width:70ch}

@media (max-width:760px){
  .wrap{padding:28px 18px 60px}
  .brandbar{gap:18px}
  .panel{padding:20px 18px}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--rule);padding:14px 0}
  td{border:0;padding:0;width:auto!important}
  th:first-child,td:first-child,th:last-child,td:last-child{padding-left:0;padding-right:0}
  .fl input,.fl select{min-width:0;width:100%}
  .fl,.fl.grow{flex:1 1 100%}
  td:empty{display:none}
  td.c-ref,td.c-area,td.c-brand{margin-top:5px}
  td.c-ref div{white-space:normal}
  .status{margin-bottom:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .brandbar,.subbar,.plain,.filterbar{display:none}
  .logo{width:180px;margin-bottom:16px}
  .panel,.attention{border:1px solid #ccc;padding:16px}
  .block[hidden]{display:block!important}
  .ask[hidden]{display:grid!important}
  .block,tr,.ask{break-inside:avoid}
  a{text-decoration:none}
  td a::after{content:" (" attr(href) ")";font-size:10px;color:#666;word-break:break-all}
}
</style>
</head>

<script>
/* ============================================================
   DAILY DATA — this is the only block you edit.
   Statuses: done | moving | waiting | issue | hold
     issue / moving / hold  roll up as "Outstanding"
     waiting                rolls up as "Pending approval"
     done                   rolls up as "Accomplished"
   brand ids must match the brands list.
   ============================================================ */
const REPORT = {
  date:"2026-08-31", shiftIn:"7:00 AM", shiftOut:"3:00 PM", timezone:"Manila", preparedBy:"Gerome Dangca, Amazon Account Manager", carryOver:"Remaining tasks continue tomorrow.",
  brands:[{id:"ml",name:"Merhoff & Larkin",short:"Merhoff & Larkin"},{id:"gg",name:"Galdor's Guild",short:"Galdor's Guild"},{id:"ac",name:"Alley Cats",short:"Alley Cats"},{id:"vs",name:"Vent Scent",short:"Vent Scent"}],
  areas:[{id:"health",title:"Account health"},{id:"listings",title:"Listings and content"},{id:"shipments",title:"Shipments",note:"Chasing suppliers on missing tracking numbers, shipment status, production status and ship-ready dates."},{id:"money",title:"Reimbursements"},{id:"sourcing",title:"Sourcing"},{id:"weekly",title:"Weekly cadence"},{id:"monthly",title:"Monthly cadence"}],
  items:[{brand:"ml",area:"health",status:"issue",title:"Amazon \u2014 Food and Product Safety issue",detail:"Foam Brain flagged under children's toys. This is the only open compliance flag across all accounts today."},{brand:"gg",area:"health",status:"done",title:"Amazon \u2014 no issues"},{brand:"gg",area:"health",status:"done",title:"TikTok Shop \u2014 no issues"},{brand:"gg",area:"health",status:"done",title:"Walmart \u2014 no issues",detail:"PPC portfolio under active monitoring."},{brand:"ml",area:"health",status:"done",title:"Walmart \u2014 no issues",detail:"PPC portfolio under active monitoring."},{brand:"vs",area:"health",status:"waiting",title:"Grant Seller Central access for Vent Scent",detail:"Account health cannot be reviewed until access is issued."},{brand:"ml",area:"listings",status:"done",title:"All approved titles uploaded",url:"https://docs.google.com/spreadsheets/d/1MdoRiT3ufg7cKbu4Uwh8EcIYTk2A8Gkx0Xy4Fohg4Os/edit?usp=sharing"},{brand:"ml",area:"listings",status:"moving",title:"Foam Brain title A/B test running",detail:"Version A is outperforming Version B by 59%. Leaving it to run before calling a winner."},{brand:"gg",area:"listings",status:"done",title:"Three new titles approved and uploaded"},{brand:"ml",area:"listings",status:"done",title:"Listing optimisation sheet updated",detail:"Amazon and Helium 10 keyword work is current.",url:"https://docs.google.com/spreadsheets/d/1YIgdCIw0uOt7wUCYy_EJ74vNA5UcHyYcUr_p-wzuBvM/edit?usp=sharing"},{brand:"gg",area:"listings",status:"waiting",title:"Approve the listing optimisation sheet",detail:"Amazon and Helium 10 keyword work is ready for sign-off before anything goes live.",url:"https://docs.google.com/spreadsheets/d/1YIgdCIw0uOt7wUCYy_EJ74vNA5UcHyYcUr_p-wzuBvM/edit?usp=sharing"},{brand:"ml",area:"listings",status:"waiting",title:"Approve the Pallet Cones product video",detail:"AI-generated video is finished. Details attached in the Slack thread."},{brand:"ml",area:"listings",status:"waiting",title:"Approve the Sticky Pads product video",detail:"AI-generated video is finished. Details attached in the Slack thread."},{brand:"ml",area:"listings",status:"hold",title:"Closed for Cleaning sign video on hold",detail:"Blocked on the AI video app. Will resume once it is available."},{brand:"ac",area:"listings",status:"done",title:"All approved titles uploaded"},{brand:"ac",area:"listings",status:"done",title:"Belt hanger wood grain \u2014 hero image updated"},{brand:"ml",area:"shipments",status:"issue",title:"Pallet Cones shipment problem",detail:"Troubleshooting in progress with the supplier.",ref:"PO 2074"},{brand:"ml",area:"shipments",status:"moving",title:"CS Foam Brain Model",detail:"Receiving at the fulfilment centre.",ref:"ASIN B0BPLQKFWK, Shipment FBA19M9R6GBZ"},{brand:"ml",area:"shipments",status:"moving",title:"Road Reflectors, 10 pack, blue",detail:"Receiving at the fulfilment centre.",ref:"ASIN B08D8FH7R4, Shipment FBA19MM7G048"},{brand:"ml",area:"shipments",status:"done",title:"Wholesale commercial invoice sent to Nico"},{brand:"ml",area:"shipments",status:"waiting",title:"Foam Brain samples",detail:"Samples currently awaiting review."},{brand:"ac",area:"shipments",status:"moving",title:"BJJ Belt Display",detail:"Receiving. Production completes by month end.",ref:"ASIN B08K1HF52Q"},{brand:"ac",area:"shipments",status:"moving",title:"BJJ Belt Box",detail:"Receiving. Production completes by month end.",ref:"ASIN B09VYSS9RC"},{brand:"ac",area:"shipments",status:"moving",title:"BJJ Belt Shelf",detail:"Receiving. Production completes by month end.",ref:"ASIN B09FYK587S"},{brand:"ac",area:"shipments",status:"moving",title:"Wrestling cover cap",detail:"Receiving. Bulk order quantity estimate submitted.",ref:"ASIN B07BFHH5YP"},{brand:"ac",area:"shipments",status:"moving",title:"Wrestling hair cap cover",detail:"Receiving. Bulk order quantity estimate submitted.",ref:"ASIN B085GH2LBK"},{brand:"vs",area:"shipments",status:"moving",title:"Whole Home Air Freshener",detail:"Receiving.",ref:"ASIN B0DQYV2HDG"},{brand:"vs",area:"shipments",status:"moving",title:"Whole Home Air Freshener",detail:"Receiving.",ref:"ASIN B0D92ZDT39"},{brand:"vs",area:"shipments",status:"moving",title:"Whole Home Air Freshener",detail:"Receiving.",ref:"ASIN B0F3CL54LW"},{brand:"vs",area:"shipments",status:"moving",title:"Reorders with supplier Fiona",detail:"Handled as needed: shipment creation, supplier communication, addresses and labels."},{brand:"ml",area:"money",status:"issue",title:"Some lost inbound claims have expired",detail:"TrueOps checked today. Several lost inbound shipments were recovered; the rest fell outside the claim window and can no longer be filed."},{brand:"ml",area:"money",status:"moving",title:"Three reimbursement cases still open",detail:"x1 new ML reimbursement case"},{brand:"ml",area:"money",status:"done",title:"No new reimbursement cases found"},{brand:"ac",area:"money",status:"done",title:"No new reimbursement cases found"},{brand:"vs",area:"money",status:"done",title:"No new reimbursement cases found"},{brand:"ml",area:"sourcing",status:"waiting",title:"Send the dog details for the coyote decoy",detail:"Supplier Servina Yang is waiting on specifics from your team before quoting.",url:"https://docs.google.com/spreadsheets/d/1jP4-LKl2AqfeNqQryn1qdzqaCyGuSQlV1aRaKJnCLGI/edit?gid=1597518902#gid=1597518902"},{brand:"ml",area:"sourcing",status:"moving",title:"Archery boar target",detail:"Follow-ups sent to contacted suppliers. Still awaiting for clarification.",url:"https://docs.google.com/spreadsheets/d/1V5V6ydRIJSQXVHKiIoO6p_UckKFHqNBfi4nYF22r0z8/edit?gid=1597518902#gid=1597518902"},{brand:"ml",area:"weekly",status:"moving",title:"PPC \u2014 ACoS and ad spend monitored"},{brand:"gg",area:"weekly",status:"moving",title:"PPC \u2014 ACoS and ad spend monitored"},{brand:"gg",area:"weekly",status:"done",title:"PPC weekly stats posted to the thread"},{brand:"ml",area:"weekly",status:"done",title:"Helium 10 market tracker \u2014 no changes today"},{brand:"ac",area:"weekly",status:"moving",title:"PPC metrics",detail:"ACoS and ad spend review next Friday."},{brand:"ml",area:"monthly",status:"done",title:"PPC optimisation complete",detail:"Runs on the 15th and 30th. Next pass on the 15th."},{brand:"ml",area:"monthly",status:"done",title:"Advertising KPI report delivered",detail:"Next report on the 15th."},{brand:"ml",area:"monthly",status:"done",title:"ASIN targeting reviewed",detail:"Next review on the 15th."},{brand:"ac",area:"monthly",status:"done",title:"Manual campaign bid optimisation complete",detail:"Mid-month pass done."},{brand:"ac",area:"monthly",status:"moving",title:"Advertising KPI report",detail:"Due by month end."},{brand:"ac",area:"monthly",status:"moving",title:"ASIN product targeting campaigns",detail:"Due by month end."}]
};

/* ============================================================
   Rendering — you should not need to touch anything below.
   ============================================================ */
const STATUS = {
  issue:   { label:"Issue",      cls:"s-issue",   bucket:"out" },
  moving:  { label:"In flight",  cls:"s-moving",  bucket:"out" },
  hold:    { label:"On hold",    cls:"s-hold",    bucket:"out" },
  waiting: { label:"Your call",  cls:"s-waiting", bucket:"pend" },
  done:    { label:"Clear",      cls:"s-done",    bucket:"done" }
};
const BUCKETS = {
  out:  { label:"Outstanding",       color:"var(--harbor)",   hex:"#2A5F82" },
  pend: { label:"Pending approval",  color:"var(--marigold)", hex:"#B57E00" },
  done: { label:"Accomplished",      color:"var(--teal)",     hex:"#0E5A50" }
};

const params  = new URLSearchParams(location.search);
const allowed = params.get("brands") ? params.get("brands").split(",").map(s => s.trim().toLowerCase()) : null;
const brands   = REPORT.brands.filter(b => !allowed || allowed.includes(b.id));
const brandIds = brands.map(b => b.id);
const brandName = id => (REPORT.brands.find(b => b.id === id) || {}).short || id;

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* flatten every item once, resolving its area */
const AREA = id => REPORT.areas.find(a => a.id === id) || { id: id, title: id };
const ITEMS = REPORT.items.filter(i => brandIds.includes(i.brand)).map(i => {
  const a = AREA(i.area);
  return Object.assign({}, i, { areaId: a.id, area: a.title, note: a.note });
});
const bucketOf = it => (STATUS[it.status] || STATUS.moving).bucket;

const linkLabel = url =>
  /docs\.google\.com\/spreadsheets/.test(url) ? "Open the sheet" :
  /docs\.google\.com\/document/.test(url)    ? "Open the doc"   : "Open link";

/* approvals are simply the items awaiting a client decision */
const asks = ITEMS.filter(i => i.status === "waiting");
const askCount = id => (id === "all" ? asks.length : asks.filter(a => a.brand === id).length);

let activeBrand = brands.length === 1 ? brands[0].id : "all";
let activeSub   = "all";

/* ---------------- masthead ---------------- */
const d = new Date(REPORT.date + "T00:00:00");
document.getElementById("hdrDate").textContent =
  d.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
document.title = "End of day brief — " + d.toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
document.getElementById("hdrShift").innerHTML =
  "Covering <b>" + esc(brands.map(b => b.name).join(", ")) + "</b>. Shift " +
  esc(REPORT.shiftIn) + " to " + esc(REPORT.shiftOut) + ", " + esc(REPORT.timezone) + " time.";

/* ---------------- brand tabs ---------------- */
const brandTabs = brands.length > 1 ? [{ id:"all", short:"Overview" }, ...brands] : brands;
document.getElementById("brandbar").innerHTML = brandTabs.map(b => {
  const n = askCount(b.id);
  return `<button class="brandtab" type="button" role="tab" data-brand="${esc(b.id)}"
    aria-selected="${b.id === activeBrand}">${esc(b.short)}${n ? `<span class="n">${n}</span>` : ""}</button>`;
}).join("");

/* ---------------- approvals ---------------- */
document.getElementById("askList").innerHTML = asks.map(a => `
  <div class="ask" data-brand="${esc(a.brand)}">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <h3>${esc(brandName(a.brand))} — ${esc(a.title)}</h3>
      ${a.detail ? `<p>${esc(a.detail)}</p>` : ""}
      ${a.url ? `<p><a href="${esc(a.url)}" target="_blank" rel="noopener">${linkLabel(a.url)}</a></p>` : ""}
    </div>
  </div>`).join("");

/* ---------------- filters ---------------- */
document.getElementById("filterbar").innerHTML = `
  <label class="fl" id="flBrand"><span>Brand</span><select id="fBrand"><option value="">All brands</option>${
    brands.map(b => `<option value="${esc(b.id)}">${esc(b.short)}</option>`).join("")}</select></label>
  <label class="fl"><span>Area</span><select id="fArea"><option value="">All areas</option>${
    REPORT.areas.map(s => `<option value="${esc(s.title)}">${esc(s.title)}</option>`).join("")}</select></label>
  <label class="fl"><span>Status</span><select id="fStatus"><option value="">Any status</option>${
    Object.entries(STATUS).map(([k, s]) => `<option value="${esc(k)}">${esc(s.label)}</option>`).join("")}</select></label>
  <label class="fl grow"><span>Search</span><input id="fQ" type="search" placeholder="Task, detail, ASIN or shipment"></label>
  <button class="plain" id="fClear" type="button" hidden>Clear filters</button>`;

const fBrand  = document.getElementById("fBrand");
const fArea   = document.getElementById("fArea");
const fStatus = document.getElementById("fStatus");
const fQ      = document.getElementById("fQ");
const fClear  = document.getElementById("fClear");

const anyFilter = () => !!(fBrand.value || fArea.value || fStatus.value || fQ.value.trim());

function passes(it) {
  if (fBrand.value  && it.brand  !== fBrand.value)  return false;
  if (fArea.value   && it.area   !== fArea.value)   return false;
  if (fStatus.value && it.status !== fStatus.value) return false;
  const q = fQ.value.trim().toLowerCase();
  if (q) {
    const hay = [it.title, it.detail || "", brandName(it.brand), it.area, it.ref || ""].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

/* ---------------- chart ---------------- */
function drawChart(scoped) {
  const rows = brands.map(b => {
    const mine = scoped.filter(i => i.brand === b.id);
    return {
      name: b.short,
      out:  mine.filter(i => bucketOf(i) === "out").length,
      pend: mine.filter(i => bucketOf(i) === "pend").length,
      done: mine.filter(i => bucketOf(i) === "done").length
    };
  }).filter(r => r.out + r.pend + r.done > 0);

  const max = Math.max(1, ...rows.map(r => r.out + r.pend + r.done));
  const labelW = 152, padR = 46, W = 900, barH = 26, gap = 20;
  const trackW = W - labelW - padR;
  const H = rows.length * (barH + gap);

  const seg = (r, y) => {
    let x = labelW, out = "";
    ["out", "pend", "done"].forEach(k => {
      if (!r[k]) return;
      const w = (r[k] / max) * trackW;
      out += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${barH}" fill="${BUCKETS[k].hex}"></rect>`;
      if (w > 22) out += `<text x="${(x + w / 2).toFixed(1)}" y="${y + barH / 2 + 4.5}" text-anchor="middle"
        font-size="13" font-weight="600" fill="#fff">${r[k]}</text>`;
      x += w;
    });
    out += `<text x="${(x + 10).toFixed(1)}" y="${y + barH / 2 + 4.5}" font-size="13" fill="#8A958F">${r.out + r.pend + r.done}</text>`;
    return out;
  };

  document.getElementById("chart").innerHTML = rows.length ? `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Task counts by brand, split into outstanding, pending approval and accomplished."
         preserveAspectRatio="xMinYMin meet" font-family="Archivo, sans-serif">
      ${rows.map((r, i) => {
        const y = i * (barH + gap);
        return `<text x="0" y="${y + barH / 2 + 5}" font-size="14.5" font-weight="600" fill="#16201C">${esc(r.name)}</text>
                <rect x="${labelW}" y="${y}" width="${trackW}" height="${barH}" fill="#EDF0ED"></rect>${seg(r, y)}`;
      }).join("")}
    </svg>` : "";
}

/* ---------------- tables ---------------- */
const statusCell = it => {
  const s = STATUS[it.status] || STATUS.moving;
  return `<div class="status ${s.cls}"><span class="mark" aria-hidden="true"></span>${s.label}</div>`;
};
const refCell = it => (it.ref ? `<div>${esc(it.ref)}</div>` : "")
  + (it.url ? `<div><a href="${esc(it.url)}" target="_blank" rel="noopener">${linkLabel(it.url)}</a></div>` : "");

function table(items, cols) {
  const head = { status:"Status", task:"Task", ref:"Reference", area:"Area", brand:"Brand" };
  return `<table>
    <thead><tr>${cols.map(c => `<th class="c-${c}">${head[c]}</th>`).join("")}</tr></thead>
    <tbody>${items.map(it => `<tr>${cols.map(c => {
      if (c === "status") return `<td class="c-status">${statusCell(it)}</td>`;
      if (c === "task")   return `<td><div class="task">${esc(it.title)}</div>${it.detail ? `<p class="detail">${esc(it.detail)}</p>` : ""}</td>`;
      if (c === "ref")    return `<td class="c-ref">${refCell(it)}</td>`;
      if (c === "area")   return `<td class="c-area">${esc(it.area)}</td>`;
      if (c === "brand")  return `<td class="c-brand">${esc(brandName(it.brand))}</td>`;
      return "";
    }).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

function blockHTML(id, title, items, cols, note) {
  return `<section class="block" data-key="${esc(id)}">
    <h2>${esc(title)}<span class="count">${items.length} ${items.length === 1 ? "item" : "items"}</span></h2>
    ${note ? `<p class="note">${esc(note)}</p>` : ""}
    ${table(items, cols)}
  </section>`;
}

/* ---------------- render ---------------- */
function render() {
  const scoped = ITEMS.filter(i =>
    (activeBrand === "all" || i.brand === activeBrand) && passes(i));
  const content = document.getElementById("content");
  let groups;

  if (activeBrand === "all") {
    groups = Object.entries(BUCKETS).map(([k, b]) => ({
      key: k,
      title: b.label === "Pending approval" ? "Pending approvals" : b.label + " tasks",
      items: scoped.filter(i => bucketOf(i) === k),
      cols: ["status", "task", "brand", "area"]
    })).filter(g => g.items.length);
  } else {
    groups = REPORT.areas.map(a => ({
      key: a.id,
      title: a.title,
      note: a.note,
      items: scoped.filter(i => i.areaId === a.id),
      cols: ["status", "task", "ref"]
    })).filter(g => g.items.length);
  }

  const keys = groups.map(g => g.key);
  if (activeSub !== "all" && !keys.includes(activeSub)) activeSub = "all";

  content.innerHTML = groups.length
    ? groups.map(g => blockHTML(g.key, g.title, g.items, g.cols, g.note)).join("")
    : `<p class="emptystate">No items match these filters. Clear one to widen the view.</p>`;
  content.querySelectorAll(".block").forEach(b =>
    b.hidden = activeSub !== "all" && b.dataset.key !== activeSub);

  document.getElementById("subbar").innerHTML =
    `<button class="subtab" type="button" role="tab" data-sub="all" aria-selected="${activeSub === "all"}">Everything<span class="n">${scoped.length}</span></button>` +
    groups.map(g => `<button class="subtab" type="button" role="tab" data-sub="${esc(g.key)}" aria-selected="${activeSub === g.key}">${esc(g.title)}<span class="n">${g.items.length}</span></button>`).join("");

  /* chart + legend */
  const n = k => scoped.filter(i => bucketOf(i) === k).length;
  document.getElementById("legend").innerHTML = Object.entries(BUCKETS).map(([k, b]) =>
    `<span class="leg"><span class="sw" style="background:${b.color}"></span><span class="v" style="color:${b.color}">${n(k)}</span><span class="t">${b.label === "Pending approval" ? "Pending approvals" : b.label}</span></span>`
  ).join("");
  document.getElementById("chartLede").textContent = activeBrand === "all"
    ? "Every task logged today, grouped by whether it is moving, waiting on you, or finished."
    : brandName(activeBrand) + " only. Same three groups.";
  drawChart(scoped);

  /* filter chrome */
  document.getElementById("flBrand").classList.toggle("hidden", activeBrand !== "all");
  fClear.hidden = !anyFilter();

  const issues = scoped.filter(i => i.status === "issue");
  const fl = document.getElementById("flagline");
  fl.hidden = !issues.length;
  fl.textContent = issues.length
    ? issues.length + (issues.length === 1 ? " item is flagged as an issue: " : " items are flagged as issues: ")
      + issues.map(i => i.title).join("; ")
    : "";

  /* approvals panel — hidden on Overview, where the Pending approvals table covers it */
  document.querySelectorAll(".ask").forEach(a =>
    a.hidden = activeBrand !== "all" && a.dataset.brand !== activeBrand);
  document.getElementById("attention").hidden =
    activeBrand === "all" || !askCount(activeBrand);

  /* tabs + tally */
  document.querySelectorAll(".brandtab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.brand === activeBrand));
  const shown = [...content.querySelectorAll(".block:not([hidden]) tbody tr")].length;
  const pool = ITEMS.filter(i => activeBrand === "all" || i.brand === activeBrand).length;
  document.getElementById("tally").textContent =
    `${shown} of ${pool} items shown` +
    (activeBrand === "all" ? " across all brands." : ` for ${brandName(activeBrand)}.`);
}

/* ---------------- key + footer ---------------- */
document.getElementById("key").innerHTML = Object.values(STATUS).map(s =>
  `<span class="k ${s.cls}"><span class="mark" aria-hidden="true"></span>${s.label}</span>`).join("");
document.getElementById("footer").textContent =
  REPORT.carryOver + " Prepared by " + REPORT.preparedBy + ".";

/* ---------------- events ---------------- */
["input", "change"].forEach(ev =>
  document.getElementById("filterbar").addEventListener(ev, e => {
    if (e.target === fClear) return;
    render();
  }));
fClear.addEventListener("click", () => {
  fBrand.value = ""; fArea.value = ""; fStatus.value = ""; fQ.value = "";
  render();
});

document.getElementById("brandbar").addEventListener("click", e => {
  const t = e.target.closest(".brandtab");
  if (!t) return;
  activeBrand = t.dataset.brand;
  activeSub = "all";
  if (activeBrand !== "all") fBrand.value = "";
  render();
});
document.getElementById("subbar").addEventListener("click", e => {
  const t = e.target.closest(".subtab");
  if (!t) return;
  activeSub = t.dataset.sub;
  render();
});
function arrowNav(bar, sel, set) {
  bar.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const tabs = [...bar.querySelectorAll(sel)];
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    set(tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length].dataset);
    render();
    const cur = bar.querySelector('[aria-selected="true"]');
    if (cur) cur.focus();
  });
}
arrowNav(document.getElementById("brandbar"), ".brandtab", ds => { activeBrand = ds.brand; activeSub = "all"; });
arrowNav(document.getElementById("subbar"), ".subtab", ds => activeSub = ds.sub);
document.getElementById("printBtn").addEventListener("click", () => window.print());

render();
</script>
</body>
</html>
